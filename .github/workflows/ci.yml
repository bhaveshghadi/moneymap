name: CI

# Runs on every push and on every pull request. Each job must pass before merging.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONEYMAP_DATA_DIR: /tmp/moneymap-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations — upgrade, downgrade, upgrade, check
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Exactly one migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t moneymap:ci .
