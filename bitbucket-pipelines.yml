# Runs on every pull request and on pushes to develop/main.
# A PR can only be merged when every step is green (branch restriction in Bitbucket).
definitions:
  steps:
    - step: &backend
        name: Backend — lint, migrations, tests
        image: python:3.13-slim
        caches: [pip]
        script:
          - cd backend
          - pip install -r requirements.txt -r requirements-dev.txt
          - ruff check .
          - export MONEYMAP_DATA_DIR=/tmp/moneymap-ci
          - alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
          - test "$(alembic heads | wc -l)" -eq 1   # exactly one migration head
          - pytest
    - step: &frontend
        name: Frontend — lint, types, build
        image: node:22-alpine
        caches: [node]
        script:
          - cd frontend
          - npm ci --no-audit --no-fund
          - npm run lint
          - npm run typecheck
          - npm run build
    - step: &docker
        name: Docker image builds
        services: [docker]
        script:
          - docker build -t moneymap:ci .

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *backend
          - step: *frontend
      - step: *docker
  branches:
    develop:
      - parallel:
          - step: *backend
          - step: *frontend
    main:
      - parallel:
          - step: *backend
          - step: *frontend
      - step: *docker
