# Optional: host nginx in front of the moneymap container.
# Copy into your nginx sites config, change server_name, then reload nginx.
# The container serves everything (pages + /api); compose maps it to host port 9009.

server {
    listen 80;
    server_name moneymap.home.lan;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:9009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# With TLS, add a `listen 443 ssl;` server block with your certificates and
# set MONEYMAP_COOKIE_SECURE: "true" in docker-compose.yml.
